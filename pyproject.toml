[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-knowledge-hygiene"
version = "0.1.0"
description = "Score support knowledge assets for ownership, freshness, usage, and duplication risk."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Joseph P. Joseph" }]
dependencies = []

[project.scripts]
support-knowledge-hygiene = "support_knowledge_hygiene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
